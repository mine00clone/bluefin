# Bluefin Trading Bot Configuration
# This file contains all non-secret configuration.
# Secrets (API keys, private keys) go in .env

[env]
# Environment: "staging" or "prod"
name = "prod"

[rest]
# REST API base URLs
# Format: https://api.{env}.bluefin.io/v1 (exchange data)
#         https://trade.api.{env}.bluefin.io (trading)
#         https://auth.api.{env}.bluefin.io (authentication)
# env = "sui-staging" or "sui-prod"

# Exchange data API (public)
exchange_url = "https://api.sui-prod.bluefin.io/v1"
# Trading API (authenticated)
trade_url = "https://trade.api.sui-prod.bluefin.io"
# Auth API
auth_url = "https://auth.api.sui-prod.bluefin.io"

[ws]
# WebSocket URLs
# Market stream for order book, trades, tickers
market_url = "wss://stream.api.sui-prod.bluefin.io/ws/market"
# Account stream for order updates, positions, balances
account_url = "wss://stream.api.sui-prod.bluefin.io/ws/account"

[markets]
# Trading pairs to monitor/trade
# Add or remove symbols as needed
symbols = ["BTC-PERP", "ETH-PERP"]

[storage]
# SQLite database path (relative to project root)
db_path = "data/bluefin.db"
# Raw response dump path
raw_path = "data/raw"

[orders]
# Safety gate: must be true to place orders from raw scripts
allow_trading = true
# Default leverage (1-100); used by raw create order scripts
default_leverage = 10
# Default order flags (configurable without rebuild)
post_only = true
reduce_only = false
# TAKER | MAKER | BOTH | UNSPECIFIED
self_trade_prevention_type = "MAKER"

[orders.create]
# Order parameters for raw create order script
market = "BTC-PERP"
side = "BUY"
order_type = "LIMIT"
time_in_force = "GTC"
size = "0.001"
# Price offset in basis points from last price (e.g., -300 = 3% below)
price_offset_bps = -300
# Optional absolute price override (string); when empty, offset is used
price_override = ""

[orders.cancel]
# Cancel parameters for raw cancel script
market = "BTC-PERP"
order_hashes = []
cancel_all = false
